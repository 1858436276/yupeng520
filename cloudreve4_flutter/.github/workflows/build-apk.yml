name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configure Android NDK env
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* | head -1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK version: $NDK_DIR"

      - name: Complete Flutter wrapper files
        run: |
          flutter create --platforms=android --project-name cloudreve4_flutter --org com.limo .
          flutter pub get

      - name: Use official Gradle distribution URL
        run: |
          sed -i 's|https\\://mirrors.huaweicloud.com/gradle/|https://services.gradle.org/distributions/|' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Generate release signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cloudreve123 -keypass cloudreve123 \
            -dname "CN=Cloudreve4, OU=Dev, O=Dev, L=Shenzhen, ST=Guangdong, C=CN"
          printf 'storePassword=cloudreve123\nkeyPassword=cloudreve123\nkeyAlias=release\nstoreFile=%s\n' "$RUNNER_TEMP/release.keystore" > android/key.properties
          ls -la android/key.properties

      - name: Build APK (split per ABI)
        run: |
          bash build.sh apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudreve4-flutter-apk
          path: dist/android/*.apk
          if-no-files-found: error
