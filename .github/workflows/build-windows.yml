name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cloudreve4_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.4'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package into ZIP
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath cloudreve4-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudreve4-windows
          path: cloudreve4_flutter/cloudreve4-windows.zip
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: cloudreve4_flutter/cloudreve4-windows.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
