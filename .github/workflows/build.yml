name: Build and Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudreve4_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Download and setup NDK
        run: |
          cd $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          mkdir -p ndk
          mv android-ndk-r26c ndk/26.3.11579264
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
          cache: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build native Rust libraries
        run: |
          cd native
          cargo ndk -t armeabi-v7a -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release

      - name: Verify native libraries
        run: |
          echo "=== Native libraries ==="
          ls -la android/app/src/main/jniLibs/ || echo "No jniLibs directory!"
          find android/app/src/main/jniLibs -name "*.so" 2>/dev/null | head -20 || echo "No .so files found!"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Set Android compileSdk 35
        run: |
          printf 'flutter.compileSdkVersion=35\nflutter.targetSdkVersion=35\nflutter.minSdkVersion=31\n' > android/local.properties
          cat android/local.properties

      - name: Generate release signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cloudreve123 -keypass cloudreve123 \
            -dname "CN=Cloudreve4, OU=Dev, O=Dev, L=Shenzhen, ST=Guangdong, C=CN"
          printf 'storePassword=cloudreve123\nkeyPassword=cloudreve123\nkeyAlias=release\nstoreFile=%s\n' "$RUNNER_TEMP/release.keystore" > android/key.properties

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudreve4-flutter-apk
          path: cloudreve4_flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: cloudreve4_flutter/build/app/outputs/flutter-apk/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
